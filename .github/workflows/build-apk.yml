name: Build REAL NOW APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract source
        run: unzip -o REAL_NOW_060_DOWNLOAD.zip -d ./web-source
      - name: Create Nitron config
        run: |
          cd ./web-source
          echo '{
            "name": "Real Now",
            "packageId": "com.realnow.app",
            "version": "1.0.0",
            "entry": "app.html",
            "orientation": "portrait",
            "permissions": ["INTERNET", "ACCESS_NETWORK_STATE"]
          }' > nitron.config.json
      - name: Build APK with Nitron
        run: |
          cd ./web-source
          npx nitron build
      - uses: actions/upload-artifact@v4
        with:
          name: REAL-NOW-APK
          path: web-source/dist/app.apk
          if-no-files-found: error
