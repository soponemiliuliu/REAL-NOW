name: Build REAL NOW APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create Nitron config
        run: |
          echo '{
            "name": "Real Now",
            "packageId": "com.realnow.app",
            "version": "1.0.1",
            "entry": "app.html",
            "orientation": "portrait",
            "icon": "Screenshot_20261105-114304~2.jpg",
            "permissions": ["INTERNET", "ACCESS_NETWORK_STATE", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION"]
          }' > nitron.config.json
      - name: Build APK with Nitron
        run: |
          npx nitron build
      - uses: actions/upload-artifact@v4
        with:
          name: REAL-NOW-APK
          path: dist/app.apk
          if-no-files-found: error
