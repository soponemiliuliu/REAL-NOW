name: Build REAL NOW APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract source
        run: unzip -o REAL_NOW_060_DOWNLOAD.zip -d ./web-source
      - name: Build APK with Nitron
        run: |
          cd ./web-source
          npx nitron init
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: REAL-NOW-APK
          path: web-source/dist/app.apk
          if-no-files-found: error
