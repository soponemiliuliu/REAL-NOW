name: Build REAL NOW APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'REAL_NOW_060_DOWNLOAD.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project source
        run: |
          unzip -o REAL_NOW_060_DOWNLOAD.zip -d ./android-source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ./android-source
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REAL-NOW-Android-debug-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
