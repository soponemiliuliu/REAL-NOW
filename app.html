<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Now</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            color: white; padding-bottom: 70px; overflow-x: hidden;
        }

        .jder {
            position: fixed; width: 80px; height: 80px;
            background-image: url('https://images.unsplash.com/photo-1549480017-d76466a4b7e8?auto=format&fit=crop&w=150&q=80'); 
            background-size: cover; background-position: center;
            border-radius: 50%; border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); z-index: 1000; transition: all 2s ease-in-out;
        }
        .jder.stop { transform: scale(1.3); border-color: #ffcc00; }

        .page { display: none; }
        .page.active { display: block; }

        .header { text-align: center; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 0 0 20px 20px; }
        .header h1 { margin: 0; font-size: 32px; color: #ff3333; text-shadow: 2px 2px 4px #000; }
        
        .location-bar { background: white; color: black; margin: 10px auto; padding: 10px; border-radius: 25px; width: 90%; display: flex; justify-content: space-between; font-weight: bold; cursor: pointer; }

        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .category-btn { background-color: #333; border-radius: 12px; overflow: hidden; color: white; display: flex; flex-direction: column; cursor: pointer; border: none; padding: 0; text-align: left; width: 100%;}
        .category-btn img { width: 100%; height: 60px; object-fit: cover; }
        .category-btn .btn-text { padding: 8px; text-align: center; font-weight: bold; font-size: 12px; }
        
        .bg-blue { background-color: #1e90ff; } .bg-green { background-color: #32cd32; }
        .bg-purple { background-color: #8a2be2; } .bg-red { background-color: #dc143c; }
        .bg-orange { background-color: #ff8c00; } .bg-teal { background-color: #008080; }
        .bg-brown { background-color: #8b4513; }

        #map-main { height: 180px; width: 95%; margin: 15px auto; border-radius: 12px; border: 3px solid white; }
        
        /* Harta din pagina 2 */
        #map-list { height: 200px; width: 100%; border-radius: 12px; margin-bottom: 15px; border: 2px solid white; display: none; }

        .sub-header { background: #333; padding: 15px; display: flex; align-items: center; color: white; position: sticky; top: 0; z-index: 100; }
        .sub-header button { background: none; border: none; color: white; font-size: 24px; margin-right: 15px; cursor: pointer; }
        .sub-header h2 { margin: 0; font-size: 20px; }
        
        .list-container { padding: 15px; }
        
        /* Butoanele pentru Cluj / Alte orase */
        .subcategory { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; align-items: center; cursor: pointer; color: #333; }
        .subcategory img { width: 50px; height: 50px; border-radius: 50%; margin-right: 15px; object-fit: cover; }
        .subcategory span { font-weight: bold; }

        /* Lista de magazine/restaurante */
        .place-item { background: white; padding: 10px; margin-bottom: 10px; border-radius: 10px; color: #333; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .place-info { flex: 1; }
        .place-info h4 { margin: 0 0 5px 0; font-size: 16px; }
        .place-info p { margin: 0; font-size: 12px; color: #666; }
        .place-btn { background: #1e90ff; color: white; border: none; padding: 8px 12px; border-radius: 15px; font-weight: bold; font-size: 12px; cursor: pointer; }

        .chat-box { padding: 15px; height: 50vh; overflow-y: auto; background: #f5f5f5; margin: 15px; border-radius: 15px; color: black; }
        .chat-msg { background: #ddd; padding: 10px; border-radius: 10px; margin-bottom: 10px; width: fit-content; max-width: 80%; }
        .chat-msg.me { background: #1e90ff; color: white; margin-left: auto; }
        .chat-input { display: flex; padding: 0 15px; }
        .chat-input input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
        .chat-input button { padding: 10px 20px; background: #32cd32; color: white; border: none; border-radius: 20px; margin-left: 10px; font-weight: bold; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 8px 0; border-radius: 20px 20px 0 0; z-index: 999; color: black; }
        .bottom-nav div { font-size: 11px; text-align: center; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="jder" id="jder"></div>

    <!-- PAGINA 1: Acasa -->
    <div id="page-home" class="page active">
        <div class="header"><h1>REAL NOW</h1></div>
        <div class="location-bar" onclick="getLocation()">
            <div id="loc-text">✅ Locație necunoscută</div>
            <div><span>📍 Schimbă</span></div>
        </div>

        <div class="grid-container">
            <button onclick="openCategory('Restaurante', '#8a2be2')" class="category-btn">
                <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=300&q=80">
                <div class="btn-text bg-purple">🍽️ Restaurante</div>
            </button>
            <button onclick="openCategory('Farmacii', '#32cd32')" class="category-btn">
                <img src="https://images.unsplash.com/photo-1587854692152-cbe660dbde88?auto=format&fit=crop&w=300&q=80">
                <div class="btn-text bg-green">💊 Farmacii</div>
            </button>
            <button onclick="openCategory('Magazine', '#dc143c')" class="category-btn">
                <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=300&q=80">
                <div class="btn-text bg-red">🛍️ Magazine</div>
            </button>
            <button onclick="openCategory('Benzinării', '#008080')" class="category-btn">
                <img src="https://images.unsplash.com/photo-1527018601619-a508a2be00cd?auto=format&fit=crop&w=300&q=80">
                <div class="btn-text bg-teal">⛽ Benzinării</div>
            </button>
            <button onclick="openCategory('Magazine Alimentare', '#ff8c00')" class="category-btn">
                <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=300&q=80">
                <div class="btn-text bg-orange">🛒 Alimentare</div>
            </button>
            <button onclick="openCategory('Instituții Publice', '#1e90ff')" class="category-btn">
                <img src="https://images.unsplash.com/photo-1577412647305-991150c7d163?auto=format&fit=crop&w=300&q=80">
                <div class="btn-text bg-blue">🏛️ Instituții</div>
            </button>
            <button onclick="openCategory('Piețe', '#ff8c00')" class="category-btn">
                <img src="https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=300&q=80">
                <div class="btn-text bg-orange">🍅 Piețe</div>
            </button>
            <button onclick="openCategory('Autogări', '#8b4513')" class="category-btn">
                <img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=300&q=80">
                <div class="btn-text bg-brown">🚌 Autogări</div>
            </button>
            <button onclick="openCategory('Gări de Tren', '#8b4513')" class="category-btn">
                <img src="https://images.unsplash.com/photo-1474487548417-781cb71495f3?auto=format&fit=crop&w=300&q=80">
                <div class="btn-text bg-brown">🚂 Gări</div>
            </button>
        </div>

        <div id="map-main"></div>
    </div>

    <!-- PAGINA 2: Lista (Subcategorii / Locatii / Harta) -->
    <div id="page-list" class="page">
        <div class="sub-header" id="list-header">
            <button onclick="goHome()">⬅</button>
            <h2 id="list-title">Categorie</h2>
        </div>
        <div class="list-container">
            <div id="map-list"></div>
            <div id="list-items"></div>
        </div>
    </div>

    <!-- PAGINA 3: Chat -->
    <div id="page-chat" class="page">
        <div class="sub-header" style="background: #1e90ff;">
            <button onclick="goBackToList()">⬅</button>
            <h2 id="chat-title">Chat</h2>
        </div>
        <div class="chat-box" id="chat-box"></div>
        <div class="chat-input">
            <input type="text" id="msg-input" placeholder="Scrie un mesaj...">
            <button onclick="sendMsg()">Trimite</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div onclick="goHome()">🏠<br>Acasă</div>
        <div onclick="alert('Preferatele vor fi adăugate curând!')">⭐<br>Preferate</div>
        <div onclick="alert('Notificările vor fi adăugate curând!')">🔔<br>Notificări</div>
        <div onclick="alert('Aici va apărea lista cu limbi străine!')">🌐<br>Limbă</div>
    </div>

    <script>
        // ================= JDERUL =================
        const jder = document.getElementById('jder');
        let step = 0;
        function moveJder() {
            const w = window.innerWidth - 90, h = window.innerHeight - 90;
            jder.classList.remove('stop');
            if (step === 0) { jder.style.top = '100px'; jder.style.left = '10px'; }
            else if (step === 1) { jder.style.top = '100px'; jder.style.left = w + 'px'; }
            else if (step === 2) { jder.style.top = h + 'px'; jder.style.left = w + 'px'; }
            else if (step === 3) { jder.style.top = h + 'px'; jder.style.left = '10px'; }
            step = (step + 1) % 4;
        }
        setInterval(() => { jder.classList.add('stop'); }, 5000);
        moveJder(); setInterval(moveJder, 4000);

        // ================= HARTI & LOCATIE =================
        function getLocation() {
            document.getElementById('loc-text').innerText = "⏳ Se caută...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        document.getElementById('loc-text').innerText = "✅ Locație găsită!";
                        mapMain.setView([pos.coords.latitude, pos.coords.longitude], 14);
                    },
                    (err) => {
                        document.getElementById('loc-text').innerText = "❌ Locație blocată";
                        alert("Te rog permite accesul la locație!");
                    }
                );
            }
        }

        var mapMain = L.map('map-main').setView([46.7712, 23.6236], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapMain);

        var mapList;
        function initMapList() {
            if (!mapList) {
                mapList = L.map('map-list').setView([46.7712, 23.6236], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapList);
            } else {
                mapList.invalidateSize();
            }
        }

        // ================= DATE (Lista de locatii) =================
        // Aici vom pune datele. Deocamdata sunt de test.
        const data = {
            "Magazine": {
                "Cluj": [
                    { name: "Kaufland Cluj", program: "08:00 - 22:00", lat: 46.771, lng: 23.623 },
                    { name: "Carrefour Cluj", program: "08:00 - 22:00", lat: 46.775, lng: 23.630 },
                    { name: "Lidl Cluj", program: "07:00 - 21:00", lat: 46.768, lng: 23.615 },
                    { name: "Profi Cluj", program: "07:00 - 23:00", lat: 46.780, lng: 23.620 }
                ],
                "Alte Orase": [
                    { name: "Kaufland Turda", program: "08:00 - 21:00", lat: 46.566, lng: 23.783 },
                    { name: "Carrefour Turda", program: "08:00 - 22:00", lat: 46.570, lng: 23.780 }
                ]
            },
            "Restaurante": {
                "Cluj": [
                    { name: "Restaurant Baracca", program: "12:00 - 23:00", lat: 46.771, lng: 23.623 },
                    { name: "Roata", program: "11:00 - 22:00", lat: 46.773, lng: 23.618 }
                ],
                "Alte Orase": [
                    { name: "Restaurant Turda", program: "10:00 - 22:00", lat: 46.566, lng: 23.783 }
                ]
            }
        };

        // ================= NAVIGARE =================
        let currentCategory = "";
        let currentSub = "";

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0,0);
        }

        function goHome() { showPage('page-home'); }

        function openCategory(categoryName, color) {
            currentCategory = categoryName;
            document.getElementById('list-title').innerText = categoryName;
            document.getElementById('list-header').style.backgroundColor = color;
            
            // Ascundem harta
            document.getElementById('map-list').style.display = 'none';

            // Aratam cele 2 optiuni (Cluj si Alte Orase)
            let html = `
                <div class="subcategory" onclick="showPlaces('${categoryName}', 'Cluj')">
                    <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=100&q=80">
                    <span>${categoryName} în Cluj</span>
                </div>
                <div class="subcategory" onclick="showPlaces('${categoryName}', 'Alte Orase')">
                    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=100&q=80">
                    <span>${categoryName} alte orașe</span>
                </div>
            `;
            document.getElementById('list-items').innerHTML = html;
            showPage('page-list');
        }

        // Functia care afiseaza lista de magazine si harta
        function showPlaces(cat, sub) {
            currentSub = sub;
            document.getElementById('list-title').innerText = `${cat} - ${sub}`;
            
            // Aratam harta
            document.getElementById('map-list').style.display = 'block';
            initMapList();

            // Luam datele (daca nu exista, punem ceva de test)
            let places = data[cat] ? data[cat][sub] : [];

            let html = "";
            if (places.length === 0) {
                html = "<p style='color:white; text-align:center;'>Nu sunt date momentan pentru aceasta categorie.</p>";
            } else {
                places.forEach((place, index) => {
                    html += `
                        <div class="place-item">
                            <div class="place-info">
                                <h4>${place.name}</h4>
                                <p>🕒 Program: ${place.program}</p>
                            </div>
                            <button class="place-btn" onclick="openChat('${place.name}')">Chat</button>
                        </div>
                    `;
                    // Adaugam pin pe harta
                    L.marker([place.lat, place.lng]).addTo(mapList).bindPopup(`<b>${place.name}</b><br>${place.program}`);
                });
            }
            document.getElementById('list-items').innerHTML = html;
            showPage('page-list');
        }

        function goBackToList() {
            showPlaces(currentCategory, currentSub);
        }

        // ================= CHAT =================
        function openChat(placeName) {
            document.getElementById('chat-title').innerText = "Chat: " + placeName;
            document.getElementById('chat-box').innerHTML = `<div class="chat-msg">Bine ai venit în chat-ul pentru <b>${placeName}</b>! Aici poți discuta cu oamenii.</div>`;
            showPage('page-chat');
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const box = document.getElementById('chat-box');
            if (input.value.trim() !== "") {
                box.innerHTML += `<div class="chat-msg me">${input.value}</div>`;
                input.value = "";
                box.scrollTop = box.scrollHeight;
                setTimeout(() => {
                    box.innerHTML += `<div class="chat-msg">(Răspuns automat) Mesajul tău a fost înregistrat!</div>`;
                    box.scrollTop = box.scrollHeight;
                }, 1000);
            }
        }
    </script>
</body>
</html>
