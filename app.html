<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Now</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            color: white; padding-bottom: 70px; overflow-x: hidden;
        }
        .jder {
            position: fixed; width: 80px; height: 80px;
            background-image: url('https://images.unsplash.com/photo-1549480017-d76466a4b7e8?auto=format&fit=crop&w=150&q=80'); 
            background-size: cover; background-position: center;
            border-radius: 50%; border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); z-index: 1000; transition: all 2s ease-in-out;
        }
        .jder.stop { transform: scale(1.3); border-color: #ffcc00; }

        .page { display: none; }
        .page.active { display: block; }

        .header { text-align: center; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 0 0 20px 20px; }
        .header h1 { margin: 0; font-size: 32px; color: #ff3333; text-shadow: 2px 2px 4px #000; }
        
        .location-bar { background: white; color: black; margin: 10px auto; padding: 10px; border-radius: 25px; width: 90%; display: flex; justify-content: space-between; font-weight: bold; cursor: pointer; }

        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .category-btn { background-color: #333; border-radius: 12px; overflow: hidden; color: white; display: flex; flex-direction: column; cursor: pointer; border: none; padding: 0; text-align: left; width: 100%;}
        .category-btn img { width: 100%; height: 60px; object-fit: cover; }
        .category-btn .btn-text { padding: 8px; text-align: center; font-weight: bold; font-size: 12px; }
        
        .bg-blue { background-color: #1e90ff; } .bg-green { background-color: #32cd32; }
        .bg-purple { background-color: #8a2be2; } .bg-red { background-color: #dc143c; }
        .bg-orange { background-color: #ff8c00; } .bg-teal { background-color: #008080; }
        .bg-brown { background-color: #8b4513; }

        #map-main { height: 180px; width: 95%; margin: 15px auto; border-radius: 12px; border: 3px solid white; }
        #map-list { height: 200px; width: 100%; border-radius: 12px; margin-bottom: 15px; border: 2px solid white; display: none; }

        .sub-header { background: #333; padding: 15px; display: flex; align-items: center; color: white; position: sticky; top: 0; z-index: 100; }
        .sub-header button { background: none; border: none; color: white; font-size: 24px; margin-right: 15px; cursor: pointer; }
        .sub-header h2 { margin: 0; font-size: 20px; }
        
        .list-container { padding: 15px; }
        
        .place-item { background: white; padding: 10px; margin-bottom: 10px; border-radius: 10px; color: #333; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .place-info { flex: 1; }
        .place-info h4 { margin: 0 0 5px 0; font-size: 16px; }
        .place-info p { margin: 0; font-size: 12px; color: #666; }
        .place-btn { background: #1e90ff; color: white; border: none; padding: 8px 12px; border-radius: 15px; font-weight: bold; font-size: 12px; cursor: pointer; }

        .chat-box { padding: 15px; height: 45vh; overflow-y: auto; background: #f5f5f5; margin: 15px; border-radius: 15px; color: black; }
        .chat-msg { background: #ddd; padding: 10px; border-radius: 10px; margin-bottom: 10px; width: fit-content; max-width: 80%; word-wrap: break-word; }
        .chat-msg.me { background: #1e90ff; color: white; margin-left: auto; }
        .chat-msg img { max-width: 100%; border-radius: 10px; margin-top: 5px; }
        
        .chat-controls { display: flex; padding: 0 15px; align-items: center; }
        .chat-controls input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
        .chat-controls button { padding: 10px; border: none; border-radius: 50%; margin-left: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-emoji { background: #ffcc00; color: black; }
        .btn-photo { background: #ff8c00; color: white; }
        .btn-send { background: #32cd32; color: white; padding: 10px 15px; border-radius: 20px; }

        .emoji-picker { display: none; padding: 10px; background: white; margin: 0 15px; border-radius: 10px; font-size: 24px; text-align: center; }
        .emoji-picker span { cursor: pointer; margin: 0 5px; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 8px 0; border-radius: 20px 20px 0 0; z-index: 999; color: black; }
        .bottom-nav div { font-size: 11px; text-align: center; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="jder" id="jder"></div>

    <div id="page-home" class="page active">
        <div class="header"><h1>REAL NOW</h1></div>
        <div class="location-bar" onclick="changeCity()">
            <div id="loc-text">📍 Locație: Se caută...</div>
            <div><span>Schimbă</span></div>
        </div>
        <div class="grid-container" id="main-categories"></div>
        <div id="map-main"></div>
    </div>

    <div id="page-list" class="page">
        <div class="sub-header" id="list-header">
            <button onclick="goHome()">⬅</button>
            <h2 id="list-title">Categorie</h2>
        </div>
        <div class="list-container">
            <div id="map-list"></div>
            <div id="list-items"></div>
        </div>
    </div>

    <div id="page-chat" class="page">
        <div class="sub-header" style="background: #1e90ff;">
            <button onclick="goBackToList()">⬅</button>
            <h2 id="chat-title">Chat</h2>
        </div>
        <div class="chat-box" id="chat-box"></div>
        
        <div class="emoji-picker" id="emoji-picker">
            <span onclick="addEmoji('😀')">😀</span>
            <span onclick="addEmoji('😂')">😂</span>
            <span onclick="addEmoji('👍')">👍</span>
            <span onclick="addEmoji('❤️')">❤️</span>
            <span onclick="addEmoji('🔥')">🔥</span>
        </div>

        <div class="chat-controls">
            <button class="btn-emoji" onclick="toggleEmoji()">😊</button>
            <button class="btn-photo" onclick="document.getElementById('file-input').click()">📷</button>
            <input type="file" id="file-input" accept="image/*" style="display:none" onchange="uploadImage(event)">
            <input type="text" id="msg-input" placeholder="Scrie un mesaj...">
            <button class="btn-send" onclick="sendMsg()">Trimite</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div onclick="goHome()">🏠<br>Acasă</div>
        <div onclick="alert('Preferatele vor fi adăugate curând!')">⭐<br>Preferate</div>
        <div onclick="alert('Notificările vor fi adăugate curând!')">🔔<br>Notificări</div>
        <div onclick="alert('Aici va apărea lista cu limbi străine!')">🌐<br>Limbă</div>
    </div>

    <script>
        // ================= JDERUL =================
        const jder = document.getElementById('jder');
        let step = 0;
        function moveJder() {
            const w = window.innerWidth - 90, h = window.innerHeight - 90;
            jder.classList.remove('stop');
            if (step === 0) { jder.style.top = '100px'; jder.style.left = '10px'; }
            else if (step === 1) { jder.style.top = '100px'; jder.style.left = w + 'px'; }
            else if (step === 2) { jder.style.top = h + 'px'; jder.style.left = w + 'px'; }
            else if (step === 3) { jder.style.top = h + 'px'; jder.style.left = '10px'; }
            step = (step + 1) % 4;
        }
        setInterval(() => { jder.classList.add('stop'); }, 5000);
        moveJder(); setInterval(moveJder, 4000);

        // ================= DATE =================
        let currentCityName = "Cluj-Napoca";
        
        // Coordonate reale pentru orasele mari
        const cityCoords = {
            "Cluj-Napoca": [46.7712, 23.6236],
            "București": [44.4268, 26.1025],
            "Timișoara": [45.7489, 21.2087],
            "Iași": [47.1585, 27.6014],
            "Sibiu": [45.7983, 24.1256],
            "Brașov": [45.6580, 25.6012],
            "Constanța": [44.1598, 28.6348],
            "Craiova": [44.3302, 23.7949],
            "Oradea": [47.0465, 21.9189],
            "Galați": [45.4353, 28.0080]
        };

        function getCityCoords(city) {
            return cityCoords[city] || [45.9432, 24.9668]; // Default: centrul Romaniei
        }

        function generateLocations(city, category) {
            let locations = [];
            let [baseLat, baseLng] = getCityCoords(city);

            let names = [];
            if(category === "Restaurante") names = ["Restaurant", "Pizzerie", "Trattoria", "Bistro", "Steak House", "Crama", "Hanul", "La Bunica", "Cafenea", "Pub"];
            else if(category === "Farmacii") names = ["Farmacia Catena", "Farmacia Dona", "Farmacia Help Net", "Farmacia Sensiblu", "Farmacia Tei", "Farmacia Central", "Farmacia Verde", "Farmacia Vital", "Farmacia Plus", "Farmacia Nova"];
            else if(category === "Magazine") names = ["Kaufland", "Lidl", "Carrefour", "Mega Image", "Profi", "Penny", "Auchan", "Supermarket", "Market", "Magazin Mixt"];
            else if(category === "Instituții Publice") names = ["Primăria", "Poliția", "Spitalul", "Tribunalul", "ANAF", "Poșta", "Consiliul Județean", "Biblioteca", "Liceul", "Spitalul Clinic"];
            else if(category === "Benzinării") names = ["OMV", "Petrom", "Rompetrol", "Lukoil", "Mol", "SOCAR", "Gazprom"];
            else if(category === "Piețe") names = ["Piața Centrală", "Piața Mare", "Piața Agroalimentară", "Piața Veche"];
            else if(category === "Autogări") names = ["Autogara Beta", "Autogara Fany", "Autogara Voiajor", "Autogara Nord"];
            else if(category === "Gări de Tren") names = ["Gara Centrală", "Gara de Nord", "Gara de Est", "Gara de Vest"];
            else names = ["Locație", "Punct de interes", "Unitate", "Serviciu", "Centru"];

            for(let i=1; i<=20; i++) {
                let name = names[(i-1) % names.length] + " " + city.split('-')[0] + " " + (i > names.length ? i : "");
                locations.push({
                    name: name.trim(),
                    program: (i % 4 === 0) ? "24/7" : "08:00 - 22:00",
                    lat: baseLat + (Math.random() - 0.5) * 0.06,
                    lng: baseLng + (Math.random() - 0.5) * 0.06
                });
            }
            return locations;
        }

        // ================= INITIALIZARE =================
        function initApp() {
            renderCategories(currentCityName);
            initMaps();
        }

        function renderCategories(city) {
            document.getElementById('loc-text').innerText = `📍 Locație: ${city}`;
            
            // Mutam harta principala pe orasul selectat
            if (mapMain) {
                let [lat, lng] = getCityCoords(city);
                mapMain.setView([lat, lng], 12);
            }

            let grid = document.getElementById('main-categories');
            grid.innerHTML = "";
            
            const categories = [
                { name: "Restaurante", icon: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=300&q=80", color: "bg-purple" },
                { name: "Farmacii", icon: "https://images.unsplash.com/photo-1587854692152-cbe660dbde88?auto=format&fit=crop&w=300&q=80", color: "bg-green" },
                { name: "Magazine", icon: "https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=300&q=80", color: "bg-red" },
                { name: "Benzinării", icon: "https://images.unsplash.com/photo-1527018601619-a508a2be00cd?auto=format&fit=crop&w=300&q=80", color: "bg-teal" },
                { name: "Instituții Publice", icon: "https://images.unsplash.com/photo-1577412647305-991150c7d163?auto=format&fit=crop&w=300&q=80", color: "bg-blue" },
                { name: "Piețe", icon: "https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=300&q=80", color: "bg-orange" },
                { name: "Autogări", icon: "https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=300&q=80", color: "bg-brown" },
                { name: "Gări de Tren", icon: "https://images.unsplash.com/photo-1474487548417-781cb71495f3?auto=format&fit=crop&w=300&q=80", color: "bg-brown" }
            ];

            categories.forEach(cat => {
                let btn = document.createElement('button');
                btn.className = "category-btn";
                btn.innerHTML = `<img src="${cat.icon}"><div class="btn-text ${cat.color}">${cat.name}</div>`;
                btn.onclick = () => openCategory(cat.name, cat.color);
                grid.appendChild(btn);
            });
        }

        // ================= HARTI =================
        var mapMain, mapList;

        function initMaps() {
            let [lat, lng] = getCityCoords(currentCityName);
            mapMain = L.map('map-main').setView([lat, lng], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapMain);
        }

        // ================= NAVIGARE =================
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0,0);
        }

        function goHome() { showPage('page-home'); }

        function changeCity() {
            let city = prompt("Introdu numele orașului (ex: București, Timișoara, Constanța):", currentCityName);
            if (city) {
                currentCityName = city;
                renderCategories(city);
            }
        }

        // ================= LISTE & CHAT =================
        let currentCategoryName = "";

        function openCategory(categoryName, color) {
            currentCategoryName = categoryName;
            document.getElementById('list-title').innerText = `${categoryName} - ${currentCityName}`;
            document.getElementById('list-header').style.backgroundColor = color;
            showPlaces(categoryName);
        }

        function showPlaces(categoryName) {
            let places = generateLocations(currentCityName, categoryName);
            let [baseLat, baseLng] = getCityCoords(currentCityName);

            document.getElementById('map-list').style.display = 'block';
            setTimeout(() => { 
                if (!mapList) {
                    mapList = L.map('map-list').setView([baseLat, baseLng], 12);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapList);
                } else {
                    mapList.eachLayer((layer) => { if (layer instanceof L.Marker) mapList.removeLayer(layer); });
                }
                
                mapList.setView([baseLat, baseLng], 12);
                places.forEach(place => {
                    L.marker([place.lat, place.lng]).addTo(mapList).bindPopup(`<b>${place.name}</b><br>${place.program}`);
                });
                mapList.invalidateSize();
            }, 100);

            let html = "";
            places.forEach((place) => {
                html += `
                    <div class="place-item">
                        <div class="place-info">
                            <h4>${place.name}</h4>
                            <p>🕒 Program: ${place.program}</p>
                        </div>
                        <button class="place-btn" onclick="openChat('${place.name}')">Chat</button>
                    </div>
                `;
            });
            document.getElementById('list-items').innerHTML = html;
            showPage('page-list');
        }

        function goBackToList() {
            showPage('page-list');
        }

        function openChat(placeName) {
            document.getElementById('chat-title').innerText = "Chat: " + placeName;
            document.getElementById('chat-box').innerHTML = `<div class="chat-msg">Bun venit în chat-ul pentru <b>${placeName}</b>!</div>`;
            showPage('page-chat');
        }

        function toggleEmoji() {
            let picker = document.getElementById('emoji-picker');
            picker.style.display = (picker.style.display === 'block') ? 'none' : 'block';
        }

        function addEmoji(emoji) {
            let input = document.getElementById('msg-input');
            input.value += emoji;
            input.focus();
            toggleEmoji();
        }

        function uploadImage(event) {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let box = document.getElementById('chat-box');
                    box.innerHTML += `<div class="chat-msg me"><img src="${e.target.result}"></div>`;
                    box.scrollTop = box.scrollHeight;
                };
                reader.readAsDataURL(file);
            }
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const box = document.getElementById('chat-box');
            if (input.value.trim() !== "") {
                box.innerHTML += `<div class="chat-msg me">${input.value}</div>`;
                input.value = "";
                box.scrollTop = box.scrollHeight;
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
